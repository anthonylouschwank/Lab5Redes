# /etc/dovecot/dovecot.conf — Dovecot 2.3 para hospital.redes.test
# IMAP para los clientes (Thunderbird), LMTP para recibir de Postfix y
# autenticación contra OpenLDAP (también la usa Postfix vía SASL).
# Archivo único: reemplaza la configuración por defecto de conf.d/.

protocols = imap lmtp
listen = *

# --- Registro (va a /var/log/mail.log) ---
log_path = syslog
syslog_facility = mail
auth_verbose = yes
auth_verbose_passwords = no

# --- TLS: STARTTLS en 143; sin TLS no se aceptan contraseñas ---
ssl = yes
ssl_cert = </etc/ssl/certs/mail.hospital.redes.test.crt
ssl_key  = </etc/ssl/private/mail.hospital.redes.test.key
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes

# --- Autenticación ---
# "anthony" y "anthony@hospital.redes.test" son el mismo usuario
auth_mechanisms = plain login
auth_default_realm = hospital.redes.test
auth_username_format = %Lu

# Contraseña: bind a OpenLDAP con el DN del usuario (ver dovecot-ldap.conf.ext)
passdb {
    driver = ldap
    args = /etc/dovecot/dovecot-ldap.conf.ext
}

# Todos los buzones pertenecen al usuario del sistema vmail (5000).
# Postfix ya valida en LDAP que el destinatario exista antes de entregar.
userdb {
    driver = static
    args = uid=vmail gid=vmail home=/var/vmail/%d/%n allow_all_users=yes
}

# --- Buzones ---
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid  = 5000

namespace inbox {
    inbox = yes
    separator = /
    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }
    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }
    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }
    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }
}

# --- Servicios ---
service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 0
    }
}

# Postfix entrega el correo aquí (virtual_transport = lmtp:unix:private/dovecot-lmtp)
service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode  = 0600
        user  = postfix
        group = postfix
    }
}

# Postfix autentica a los clientes SMTP aquí (smtpd_sasl_path = private/auth)
service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode  = 0660
        user  = postfix
        group = postfix
    }
    unix_listener auth-userdb {
        mode = 0600
        user = vmail
    }
}

protocol lmtp {
    postmaster_address = postmaster@hospital.redes.test
}
