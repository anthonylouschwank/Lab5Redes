# /etc/vsftpd.conf — FTP de ftp.hospital.redes.test
# Usuarios de OpenLDAP (PAM + nslcd), encerrados en /srv/ftp/<usuario>.

listen=YES
listen_ipv6=NO
ftpd_banner=Hospital Privado Castillejos - servidor FTP

# Sin acceso anónimo; solo usuarios locales/LDAP de la lista blanca
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=077
pam_service_name=vsftpd
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Cada usuario queda encerrado (chroot) en su home: /srv/ftp/<usuario>
# (nslcd.conf mapea homeDirectory a esa ruta). La raíz del chroot es de root
# y no se puede escribir; los archivos se suben a archivos/.
chroot_local_user=YES
allow_writeable_chroot=NO
hide_ids=YES

# Conexión de datos: solo modo pasivo en un rango limitado de puertos
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
port_enable=NO
connect_from_port_20=NO

# Registro de comandos y transferencias
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

dirmessage_enable=NO
use_localtime=YES
utf8_filesystem=YES
secure_chroot_dir=/var/run/vsftpd/empty
