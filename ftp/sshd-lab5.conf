# /etc/ssh/sshd_config.d/lab5.conf
# Al integrar LDAP con PAM, las cuentas del directorio podrían iniciar sesión por SSH.
# Solo se permite SSH al administrador local de la VM; el personal usa FTP, correo y web.
# ftp/instalar-nslcd.sh reemplaza "lab" por el usuario que ejecuta el script con sudo.
AllowUsers lab
