# /etc/nslcd.conf — el sistema (NSS/PAM) obtiene usuarios y grupos de OpenLDAP.
# Lo usa vsftpd: autenticación por PAM (pam_ldap) y uid/gid de los archivos.

uid nslcd
gid nslcd

uri ldap://ldap.hospital.redes.test
base dc=hospital,dc=redes,dc=test

base passwd ou=People,dc=hospital,dc=redes,dc=test
base shadow ou=People,dc=hospital,dc=redes,dc=test
base group  ou=Groups,dc=hospital,dc=redes,dc=test

# Solo cuentas del laboratorio (uidNumber >= 10000); no tapan cuentas locales
nss_min_uid 10000
nss_initgroups_ignoreusers ALLLOCAL
