# /etc/netplan/60-lab5-wifi.yaml  (alternativa a 60-lab5.yaml cuando cada servicio corre en una compu distinta)
# enp0s3: NAT de VirtualBox (salida a Internet para apt), por DHCP, sin usar su DNS.
# enp0s8: adaptador puente al Wi-Fi compartido del grupo, IP fija (registro www de la zona).
#         Sin gateway: la ruta por defecto sigue siendo la del NAT.
# DNS: BIND9 del grupo (ns1) en la VM de Anthony.
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
      dhcp4-overrides:
        use-dns: false
    enp0s8:
      dhcp4: false
      accept-ra: false
      addresses:
        - 10.135.222.152/24
      nameservers:
        addresses:
          - 10.135.222.37
        search:
          - hospital.redes.test
