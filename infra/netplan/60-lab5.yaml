# /etc/netplan/60-lab5.yaml
# enp0s3: NAT de VirtualBox (salida a Internet para apt), por DHCP.
# enp0s8: red del laboratorio con IP fija (Host-Only 10.0.0.32/27, o Bridged en la exposición).
#         Sin gateway: la ruta por defecto sigue siendo la del NAT.
#         accept-ra: false evita que un router/celular le imponga un DNS IPv6 ajeno a la zona.
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
    enp0s8:
      dhcp4: false
      accept-ra: false
      addresses:
        - 10.0.0.37/27
