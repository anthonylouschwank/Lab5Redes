# /etc/apache2/sites-available/hospital-intranet.conf — Intranet del Hospital Privado Castillejos (Fase 3)
# Generado por fase3/isabella/instalar-web.sh a partir de esta plantilla. No editar a mano en la EC2.
#
# Defensa en profundidad para "solo desde la red interna, nunca Visitantes ni Internet":
#   1. Security Group SG-Servidores: TCP 80 solo desde Médicos, Servidores, DMZ y TI (Anthony, E4.4).
#   2. ufw (hardening.sh servidores): la misma lista.
#   3. Apache (este archivo): "Require ip" con la misma lista + login LDAP por grupo.

# Sin caché de binds/búsquedas LDAP: cada intento se valida contra el servidor (más fácil de demostrar).
LDAPCacheEntries 0
LDAPOpCacheEntries 0
LDAPConnectionTimeout 3

<VirtualHost *:80>
    ServerName www.hospital.redes.test
    DocumentRoot /var/www/hospital-intranet
    DirectoryIndex index.html index.shtml

    # Portal: solo desde las subredes autorizadas, sin login.
    <Directory /var/www/hospital-intranet>
        Options -Indexes
        AllowOverride None
        Require ip 10.0.0.0/27 10.0.0.32/27 10.0.0.96/28 10.0.0.112/28 127.0.0.1 ::1
    </Directory>

    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml

    # Intranet: subred autorizada Y usuario LDAP de un grupo autorizado.
    <Directory /var/www/hospital-intranet/intranet>
        Options +Includes
        AuthType Basic
        AuthName "Intranet - Hospital Privado Castillejos"
        AuthBasicProvider ldap
        AuthLDAPURL "ldap://127.0.0.1/ou=People,dc=hospital,dc=redes,dc=test?uid,cn,mail,title?one?(objectClass=inetOrgPerson)"
        AuthLDAPBindDN "uid=svc-intranet,ou=People,dc=hospital,dc=redes,dc=test"
        Include /etc/apache2/hospital-intranet/ldap-bind.conf
        AuthLDAPGroupAttribute memberUid
        AuthLDAPGroupAttributeIsDN off
        <RequireAll>
            Require ip 10.0.0.0/27 10.0.0.32/27 10.0.0.96/28 10.0.0.112/28 127.0.0.1 ::1
            <RequireAny>
                Require ldap-group cn=medicos,ou=Groups,dc=hospital,dc=redes,dc=test
                Require ldap-group cn=ti,ou=Groups,dc=hospital,dc=redes,dc=test
                Require ldap-group cn=laboratorio,ou=Groups,dc=hospital,dc=redes,dc=test
            </RequireAny>
        </RequireAll>
    </Directory>

    # Panel de TI: además, solo el grupo ti. mod_authnz_ldap no hereda URL ni bind del directorio padre.
    <Directory /var/www/hospital-intranet/intranet/ti>
        AuthLDAPURL "ldap://127.0.0.1/ou=People,dc=hospital,dc=redes,dc=test?uid,cn,mail,title?one?(objectClass=inetOrgPerson)"
        AuthLDAPBindDN "uid=svc-intranet,ou=People,dc=hospital,dc=redes,dc=test"
        Include /etc/apache2/hospital-intranet/ldap-bind.conf
        AuthLDAPGroupAttribute memberUid
        AuthLDAPGroupAttributeIsDN off
        <RequireAll>
            Require ip 10.0.0.0/27 10.0.0.32/27 10.0.0.96/28 10.0.0.112/28 127.0.0.1 ::1
            Require ldap-group cn=ti,ou=Groups,dc=hospital,dc=redes,dc=test
        </RequireAll>
    </Directory>

    # authnz_ldap:info registra cada autenticación fallida y su motivo (evidencia)
    LogLevel warn authnz_ldap:info
    ErrorLog  ${APACHE_LOG_DIR}/hospital-intranet-error.log
    CustomLog ${APACHE_LOG_DIR}/hospital-intranet-access.log combined
</VirtualHost>
