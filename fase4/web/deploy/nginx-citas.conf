# /etc/nginx/sites-available/citas  (Fase 4)
# Antes de Certbot: este bloque escucha en :80. `certbot --nginx --redirect`
# lo convierte en el bloque :443 (con el certificado) y crea un bloque :80
# que solo responde 301 -> https. Las cabeceras quedan en el bloque :443.

limit_req_zone $binary_remote_addr zone=citas_post:10m rate=10r/m;

# Cualquier otro Host (p. ej. acceso directo por IP) se descarta.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name hospital-castillejos.duckdns.org;

    server_tokens off;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /opt/citas/static/;
        expires 1h;
    }

    location = /citas {
        limit_req zone=citas_post burst=5 nodelay;
        include /etc/nginx/snippets/citas-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/citas-proxy.conf;
    }
}
