# /etc/prometheus/prometheus.yml — Fase 4 (TI). Todo escucha en 127.0.0.1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    red: hospital-castillejos

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: snmp-exporter
    static_configs:
      - targets: ['127.0.0.1:9116']

  - job_name: snmp
    scrape_timeout: 20s
    metrics_path: /snmp
    params:
      module: [hospital]
      auth: [hospital_v3]
    static_configs:
      - targets: ['10.0.0.117']
        labels: {equipo: TI, subred: TI}
      - targets: ['10.0.0.46']
        labels: {equipo: Servidores, subred: Servidores}
      - targets: ['10.0.0.28']
        labels: {equipo: Medicos, subred: Medicos}
      - targets: ['10.0.0.69']
        labels: {equipo: Visitantes, subred: Visitantes}
      - targets: ['10.0.0.100']
        labels: {equipo: DMZ, subred: DMZ}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116
