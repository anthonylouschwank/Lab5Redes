# /etc/apache2/sites-available/hospital.conf
# Sitio del Hospital Privado Castillejos: http://www.hospital.redes.test
# La intranet autentica contra OpenLDAP (mod_authnz_ldap).

# Sin caché de binds/búsquedas LDAP: cada intento se valida contra el servidor
# (así WEB-05 muestra el fallo en cuanto se detiene slapd).
LDAPCacheEntries 0
LDAPOpCacheEntries 0
LDAPConnectionTimeout 3

<VirtualHost *:80>
    ServerName  www.hospital.redes.test
    ServerAdmin admin@hospital.redes.test
    DocumentRoot /var/www/hospital
    DirectoryIndex index.html index.shtml

    <Directory /var/www/hospital>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Páginas .shtml: muestran los datos del usuario autenticado (variables AUTHENTICATE_*)
    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml

    # Intranet: cualquier usuario válido de ou=People
    <Directory /var/www/hospital/intranet>
        Options +Includes
        AuthType Basic
        AuthName "Intranet - Hospital Privado Castillejos"
        AuthBasicProvider ldap
        # ldap://servidor/base?atributos?alcance?filtro (el primer atributo es el usuario)
        AuthLDAPURL "ldap://ldap.hospital.redes.test/ou=People,dc=hospital,dc=redes,dc=test?uid,cn,mail,title?one?(objectClass=inetOrgPerson)"
        Require valid-user
    </Directory>

    # Panel de TI: solo miembros del grupo LDAP cn=ti (posixGroup con memberUid)
    <Directory /var/www/hospital/intranet/ti>
        # mod_authnz_ldap no hereda la URL del directorio padre
        AuthLDAPURL "ldap://ldap.hospital.redes.test/ou=People,dc=hospital,dc=redes,dc=test?uid,cn,mail,title?one?(objectClass=inetOrgPerson)"
        AuthLDAPGroupAttribute memberUid
        AuthLDAPGroupAttributeIsDN off
        Require ldap-group cn=ti,ou=Groups,dc=hospital,dc=redes,dc=test
    </Directory>

    # authnz_ldap:info registra cada autenticación fallida y su motivo
    LogLevel warn authnz_ldap:info
    ErrorLog  ${APACHE_LOG_DIR}/hospital-error.log
    CustomLog ${APACHE_LOG_DIR}/hospital-access.log combined
</VirtualHost>
